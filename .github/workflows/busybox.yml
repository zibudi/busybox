name: busybox

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - run: zig build -Doptimize=ReleaseSmall

      - name: our own shell writes what the host's shell wrote
        run: |
          bb=$PWD/zig-out/bin/busybox
          echo "busybox provides $("$bb" --list | wc -l) applets"

          # busybox dispatches on argv[0], so the scripts need a directory of the
          # names they call: the shell, and the sed, cat, cmp, find, od and dd.
          tools=$(mktemp -d)
          cp "$bb" "$tools/busybox"
          for applet in $("$bb" --list); do ln -sf busybox "$tools/$applet"; done

          generate() {
            mkdir -p "$1/include"
            cp config/zibudi.config "$1/.config"
            cd "$1"
            sh "$GITHUB_WORKSPACE/scripts/gen_build_files.sh" "$GITHUB_WORKSPACE" .
            sh "$GITHUB_WORKSPACE/scripts/embedded_scripts" include/embedded_scripts.h
            sh "$GITHUB_WORKSPACE/scripts/generate_BUFSIZ.sh" include/common_bufsiz.h
          }

          host=$(mktemp -d)
          mine=$(mktemp -d)
          ( generate "$host" )
          ( export PATH="$tools"; generate "$mine" )

          diff -r "$host" "$mine"
          echo "$(find "$mine" -type f | wc -l) files, and which shell wrote them made no difference"
